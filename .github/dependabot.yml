version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Grouped for the same reason the pre-commit hooks are: the only thing
      # tracked here is the browser-gate tooling, and one PR per package is
      # one full CI matrix per package. Majors stay outside the group — a
      # Playwright major moves the engine builds the browser gates run on.
      browser-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # The base image is digest-pinned and upstream rebuilds it for security
      # patches roughly weekly, so this would otherwise open a PR per rebuild.
      base-image:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # The only pre-commit ecosystem left ungrouped, which is why one Monday
      # produced two separate hook PRs. Batch the half that is normally inert
      # against the rule sets pinned in pyproject.toml, and deliberately leave
      # majors out of the group: a major hook bump is a style or lint-policy
      # change that has to be read on its own, not merged as one row of a
      # version table (black 23.3.0 -> 26.5.1 reformatted 234 files).
      hook-versions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      workflow-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
