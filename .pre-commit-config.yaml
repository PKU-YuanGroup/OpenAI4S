repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: check-json
      - id: check-merge-conflict
        args: ['--assume-in-merge']
  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  # astral-sh is the canonical home; charliermarsh/ruff-pre-commit is a
  # redirect. The hook id moved from `ruff` to `ruff-check` when `ruff format`
  # arrived and a bare `ruff` became ambiguous. The rule set is pinned in
  # pyproject.toml's [tool.ruff.lint]; see the comment there for why.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.1'
    hooks:
      - id: ruff-check
        args: [--fix, "--ignore=E501,F401,E722,E402,E741"]
  - repo: local
    hooks:
      - id: mypy-core
        name: mypy (strict agent core + typed host dispatcher)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true

# Never reformat: vendored third-party assets and Skills, plus captured test
# fixtures. These trees preserve byte-exact upstream or real-world payloads.
exclude: '^(openai4s/server/webui/vendor/|skills/bioskills/|tests/fixtures/)'
