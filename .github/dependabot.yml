version: 2

# Multi-ecosystem groups own their schedule. Each assigned entry below therefore
# has no per-ecosystem `schedule:` block. A second, regular entry for the same
# ecosystem and directory carries a complementary ignore list on the same
# Monday clock. The duplicate entries are intentional: together they partition
# the update classes without suppressing majors, production dependencies, or
# Black just because those changes do not belong in the routine batch.
multi-ecosystem-groups:
  routine-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    # Only the four direct development tools join the cross-ecosystem PR, and
    # only for minor/patch bumps. The regular uv entry immediately below ignores
    # exactly this subset at exactly these levels, leaving their majors and all
    # production dependency updates on the ordinary Dependabot path.
    patterns: ["mypy", "pytest", "pytest-xdist", "pre-commit"]
    multi-ecosystem-group: "routine-dependencies"
    allow:
      - dependency-type: "development"
    update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "mypy"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pytest-xdist"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "pre-commit"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # Grouped for the same reason the pre-commit hooks are: the only thing
      # tracked here is the browser-gate tooling, and one PR per package is
      # one full CI matrix per package. Majors stay outside the group — a
      # Playwright major moves the engine builds the browser gates run on.
      browser-tooling:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # The base image is digest-pinned and upstream rebuilds it for security
      # patches roughly weekly, so this would otherwise open a PR per rebuild.
      base-image:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: "pre-commit"
    directory: "/"
    # Multi-ecosystem entries require their inclusion patterns at this level.
    # Spell out the three normally inert hook repositories so Black stays out
    # of the batch: its releases are formatting-policy changes, and 23.3.0 ->
    # 26.5.1 reformatted 234 files. Do not replace this with `update-types`;
    # pre-commit hooks are git refs and this ecosystem does not SemVer-classify
    # them (its PR metadata has no `update-type:` trailer).
    patterns:
      - "https://github.com/pre-commit/pre-commit-hooks"
      - "https://github.com/pycqa/isort"
      - "https://github.com/astral-sh/ruff-pre-commit"
    multi-ecosystem-group: "routine-dependencies"

  - package-ecosystem: "pre-commit"
    directory: "/"
    # Exclude the three repositories already owned by the multi-ecosystem job.
    # Black, plus any future hook not deliberately admitted to that batch,
    # remains covered here on the original Monday schedule.
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "https://github.com/pre-commit/pre-commit-hooks"
      - dependency-name: "https://github.com/pycqa/isort"
      - dependency-name: "https://github.com/astral-sh/ruff-pre-commit"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    # github-actions is SemVer-classified, so this preserves the former
    # workflow-actions group's minor/patch boundary. Action majors can change
    # OIDC publishing and code-scanning behavior and stay out of this batch.
    patterns: ["*"]
    multi-ecosystem-group: "routine-dependencies"
    update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    # Minor/patch updates are owned by the multi-ecosystem job. Ignoring only
    # those levels here keeps every Action major on its focused review path.
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    open-pull-requests-limit: 5
